[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valetax-support-copilot"
version = "0.1.0"
description = "Deterministic MVP for a human-reviewed support co-pilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[project.scripts]
support-copilot = "support_copilot.cli:main"

[project.optional-dependencies]
dev = [
  "behave>=1.3,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
